[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interplan"
version = "0.0.1"
requires-python = ">=3.9.12"
dependencies = [
    "nuplan-devkit",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
interplan = ["**/*.yaml"]
